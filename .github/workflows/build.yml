name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -A ${{ matrix.arch }}

      - name: build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: |
            build/Release/*.dll
            build/Release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: ldbwatch
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
